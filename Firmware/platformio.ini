[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DMQTT_MAX_PACKET_SIZE=2048
    ; lodepng's own malloc/realloc/free are overridden in content_cache.cpp
    ; (heap_caps_malloc w/ MALLOC_CAP_SPIRAM) so decoding a ~2MB cached PNG
    ; doesn't fight the ~300KB internal SRAM heap.
    -DLODEPNG_NO_COMPILE_ALLOCATORS
    -DBOARD_SEEED
    ; Seeed_GFX's own TFT_eSPI.cpp compiles without our include/ dir on its
    ; path (PlatformIO scopes library builds separately), so driver.h's
    ; __has_include("driver.h") never fires there and EPaper's member
    ; functions silently never get built into the library — global build
    ; flags are the only thing every translation unit (ours + the library's)
    ; is guaranteed to see.
    -DBOARD_SCREEN_COMBO=510
    -DUSE_XIAO_EPAPER_DISPLAY_BOARD_EE02
    ; Force-included so Seeed_GFX's own translation unit (TFT_eSPI.cpp,
    ; compiled separately from ours) sees config_seeed.h's T133A01_CDI_V
    ; etc overrides too, not just our own .cpp files' normal #include.
    -include include/config.h
lib_deps =
    bblanchon/ArduinoJson@^7.1
    h2zero/NimBLE-Arduino@^1.4
; MQTT uses ESP-IDF esp-mqtt (mqtt_client.h) — no PubSubClient.
; Seeed_GFX is vendored in lib/Seeed_GFX/ (PlatformIO's project-local lib/
; takes priority over a registry lib_deps entry) so its per-panel
; calibration register tables (T133A01_Defines.h) can be made
; board-configurable via config.h -- see config_seeed.h/config_goodisplay.h.

[env:goodisplay_c02]
; GooDisplay ESP32-133C02 (real -3/WiFi-variant unit dumped and identified
; this session — see GooDisplay/README.md). Panel driven via Seeed_GFX's
; T133A01_DRIVER backend (see include/tft_setup_goodisplay.h) — GDEP133C02
; and T133A01 are the same underlying driver silicon, confirmed by an
; identical register map.
;
; A from-scratch ESP-IDF driver (panel_goodisplay.cpp, ported directly from
; GooDisplay/docs/vendor_code_example_usb_variant/comm.c + GDEP133C02.c) was
; built and fully debugged first — confirmed single-line SPI (not QSPI) and
; a left/right CS0/CS1 column split both work, and produced a correct render
; on real hardware. That in turn showed the panel needed no genuinely custom
; protocol, so retrying Seeed_GFX (this time with tft_setup_goodisplay.h's
; TFT_DC/TFT_RST pin-aliasing bug fixed) worked immediately with correct
; rotation and no manual transform math — so Seeed_GFX became the real
; implementation (2026-08-08). panel_goodisplay.cpp is kept in the tree as
; reference but excluded from this build below.
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
build_src_filter = +<*> -<panel_goodisplay.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DMQTT_MAX_PACKET_SIZE=2048
    ; lodepng's own malloc/realloc/free are overridden in content_cache.cpp
    ; (heap_caps_malloc w/ MALLOC_CAP_SPIRAM) so decoding a ~2MB cached PNG
    ; doesn't fight the ~300KB internal SRAM heap.
    -DLODEPNG_NO_COMPILE_ALLOCATORS
    -DBOARD_GOODISPLAY
    -DUSER_SETUP_LOADED=1
    -include include/config.h
    -include include/tft_setup_goodisplay.h
lib_deps =
    bblanchon/ArduinoJson@^7.1
    h2zero/NimBLE-Arduino@^1.4
; Seeed_GFX is vendored in lib/Seeed_GFX/ -- see xiao_esp32s3 env's comment.
